spring:
  application.name: crypto-wallet-manager
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: h2
    password: h2
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
coincap:
  api:
    asset-snapshot.fixed-rate: 30 # every 30 seconds
    base-url: https://mock-coincap-api.com
    apiKey: "1234"

logging:
  level:
    org.appel: DEBUG
