spring:
  application.name: crypto-wallet-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/crypto_wallet
    username: crypto
    password: crypto
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoint.health.show-details: always
  tracing:
    sampling:
      probability: 1.0  # 100% sampling for development
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
server:
  shutdown: immediate

logging:
  level:
    org.appel: INFO
    org.springframework.boot.actuator.autoconfigure.opentelemetry: DEBUG